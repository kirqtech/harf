<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="nateq-title nateq-desc">
  <title id="nateq-title">Nateq — ناطق</title>
  <desc id="nateq-desc">Dark glass Arabic letter noon with a floating emerald dot.</desc>
  
<defs>
  <linearGradient id="nk-bg" x1="10" y1="2" x2="56" y2="64" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0C1310"/>
    <stop offset="0.52" stop-color="#040706"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>
  <radialGradient id="nk-glow" cx="0" cy="0" r="1" gradientTransform="translate(32 1) rotate(90) scale(46)">
    <stop stop-color="#10B981" stop-opacity="0.34"/>
    <stop offset="0.50" stop-color="#10B981" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nk-stroke" x1="19" y1="22" x2="44" y2="46" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="0.55" stop-color="#D9FFF1"/>
    <stop offset="1" stop-color="#10B981"/>
  </linearGradient>
  <linearGradient id="nk-spec" x1="18" y1="2.2" x2="46" y2="2.2" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="nk-dotglow" x="-200%" y="-200%" width="400%" height="400%">
